# Whitelist configuration — files, domains, and rule overrides to reduce false positives
filePatterns:
  - "README.md"
  - "LICENSE*"
  - "*.lock"
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"

trustedDomains:
  - "localhost"
  - "127.0.0.1"

ruleOverrides:
  disabled: []
  severityOverrides: {}
